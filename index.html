<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAM IPTV — IPTV player for Mac, Windows, Android and Android TV</title>
<meta name="description" content="KAM IPTV is a free-to-download IPTV player for macOS, Windows, Android phones, tablets and Android TV. Bring your own playlist.">
<meta property="og:title" content="KAM IPTV">
<meta property="og:description" content="An IPTV player for Mac, Windows, Android and Android TV. Bring your own playlist.">
<meta property="og:image" content="https://denizgokce.github.io/kam-iptv/assets/icon-256.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root {
    --bg: #1c1c1e;
    --bg-2: #222222;
    --surface: #2a2a2c;
    --surface-2: #343437;
    --line: rgb(255 255 255 / 9%);
    --text: #f5f5f7;
    --text-2: rgb(235 235 245 / 70%);
    --text-3: rgb(235 235 245 / 45%);
    --accent: #138ffa;
    --accent-2: #4aa8ff;
    --ok: #30d158;
    --radius: 18px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* Nav */
  header.nav {
    position: sticky; top: 0; z-index: 10;
    background: rgb(28 28 30 / 72%);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { display: flex; align-items: center; gap: 16px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .brand img { width: 28px; height: 28px; }
  .brand:hover { text-decoration: none; }
  .nav nav { margin-left: auto; display: flex; align-items: center; gap: 20px; font-size: 14px; }
  .nav nav a { color: var(--text-2); }
  .nav nav a:hover { color: var(--text); text-decoration: none; }
  .lang { display: flex; gap: 2px; background: var(--surface); border-radius: 999px; padding: 3px; }
  .lang button {
    border: 0; background: none; color: var(--text-2); font: inherit; font-size: 12px; font-weight: 600;
    padding: 4px 9px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  @media (max-width: 640px) { .nav nav a { display: none; } .nav nav { gap: 12px; } }
  .card, .feature, .steps li { min-width: 0; }
  .file > span:first-child { min-width: 0; overflow-wrap: anywhere; }

  /* Hero */
  .hero { position: relative; overflow: hidden; padding: 88px 0 72px; text-align: center; }
  .hero::before {
    content: ""; position: absolute; inset: -40% -10% auto; height: 120%;
    background:
      radial-gradient(40% 50% at 30% 40%, rgb(19 143 250 / 28%), transparent 70%),
      radial-gradient(35% 45% at 72% 35%, rgb(94 92 230 / 22%), transparent 70%);
    pointer-events: none;
  }
  .hero > * { position: relative; }
  .hero img.icon { width: 120px; height: 120px; filter: drop-shadow(0 18px 40px rgb(19 143 250 / 35%)); }
  .hero h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1.04; letter-spacing: -0.035em; margin: 18px 0 14px; }
  .hero p.lead { font-size: clamp(17px, 2.2vw, 21px); color: var(--text-2); max-width: 640px; margin: 0 auto; }
  .cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 22px; border-radius: 999px;
    font-weight: 600; font-size: 15px; color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { text-decoration: none; background: #3d3d41; }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: #2b9bff; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn small { font-weight: 500; opacity: .75; }
  .hint { margin-top: 14px; font-size: 13px; color: var(--text-3); }
  .byo {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 8px 14px; border-radius: 999px;
    background: rgb(255 255 255 / 6%); color: var(--text-2); font-size: 13px;
  }

  /* Sections */
  section { padding: 64px 0; scroll-margin-top: 56px; }
  section + section { border-top: 1px solid var(--line); }
  h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 10px; }
  .sub { color: var(--text-2); margin: 0 0 36px; max-width: 680px; }

  /* Download cards */
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 20px; }
  .card {
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 26px;
    display: flex; flex-direction: column;
  }
  .card .head { display: flex; align-items: center; gap: 14px; }
  .card .glyph {
    width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: rgb(19 143 250 / 16%); color: var(--accent-2);
  }
  .card .glyph svg { width: 26px; height: 26px; }
  .card h3 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
  .card .platforms { color: var(--text-3); font-size: 13px; }
  .card p { color: var(--text-2); font-size: 15px; margin: 14px 0 18px; }
  .files { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }
  .file {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
    background: rgb(255 255 255 / 4%); border: 1px solid var(--line); color: var(--text);
    transition: background .15s ease, border-color .15s ease;
  }
  .file:hover { text-decoration: none; background: rgb(19 143 250 / 12%); border-color: rgb(19 143 250 / 40%); }
  .file.recommended { border-color: rgb(19 143 250 / 55%); background: rgb(19 143 250 / 10%); }
  .file .name { font-weight: 600; font-size: 15px; }
  .file .meta { color: var(--text-3); font-size: 12px; }
  .file .dl { margin-left: auto; color: var(--accent-2); display: flex; }
  .file .dl svg { width: 20px; height: 20px; }
  .file .tag { font-size: 11px; font-weight: 700; color: var(--accent-2); text-transform: uppercase; letter-spacing: .04em; }
  .card .foot { margin-top: auto; font-size: 13px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .skeleton { height: 58px; border-radius: 12px; background: linear-gradient(90deg, rgb(255 255 255 / 4%), rgb(255 255 255 / 8%), rgb(255 255 255 / 4%)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .tvlink {
    margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: rgb(48 209 88 / 8%);
    border: 1px solid rgb(48 209 88 / 25%); font-size: 13px; color: var(--text-2);
  }
  .tvlink code { display: block; margin-top: 6px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); word-break: break-all; }

  /* Features */
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
  .feature { background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .feature .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent-2); margin-bottom: 12px; }
  .feature .ico svg { width: 20px; height: 20px; }
  .feature h4 { margin: 0 0 6px; font-size: 17px; letter-spacing: -0.01em; }
  .feature p { margin: 0; color: var(--text-2); font-size: 14.5px; }

  /* Install */
  .tabs { display: inline-flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; margin-bottom: 22px; flex-wrap: wrap; }
  .tabs button {
    border: 0; background: none; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; max-width: 720px; }
  .steps li { counter-increment: s; position: relative; padding: 14px 16px 14px 56px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; color: var(--text-2); }
  .steps li::before {
    content: counter(s); position: absolute; left: 16px; top: 13px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center;
  }
  .steps b { color: var(--text); }
  .steps code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgb(255 255 255 / 7%); padding: 2px 6px; border-radius: 6px; color: var(--text); word-break: break-all; }
  .note { margin-top: 14px; font-size: 13px; color: var(--text-3); max-width: 720px; }

  /* Privacy */
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-size: 14.5px; }
  .pill svg { width: 16px; height: 16px; color: var(--ok); }

  footer { padding: 40px 0 56px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 13px; }
  footer .wrap { display: grid; gap: 10px; }
  footer p { margin: 0; max-width: 780px; }
</style>
</head>

  const REPOS = {
    desktop: 'denizgokce/kam-iptv-player-releases',
    android: 'denizgokce/kam-iptv-android-releases',
  };

  // ── Language ──────────────────────────────────────────────────────────
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  const pick = () => {
    const saved = store.get('kam-site-lang');
    if (saved && I18N[saved]) return saved;
    const nav = (navigator.languages || [navigator.language || 'en']).map((l) => l.slice(0, 2).toLowerCase());
    return nav.find((l) => I18N[l]) || 'en';
  };
  let lang = pick();
  const t = (key, vars = {}) => {
    const s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
    return s.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
  };
  // *word* → <em>; only in plain strings, so no user HTML ever reaches the page.
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const emph = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // ── Platform ──────────────────────────────────────────────────────────
  const ua = navigator.userAgent || '';
  const platform = /Android/i.test(ua)
    ? (/TV|AFT|BRAVIA|SMART-TV|GoogleTV|Chromecast/i.test(ua) ? 'tv' : /Mobile/i.test(ua) ? 'phone' : 'tablet')
    : /iPhone|iPad|iPod/i.test(ua) ? 'ios'
    : /Mac/i.test(ua) ? 'mac'
    : /Win/i.test(ua) ? 'win'
    : 'other';

  // ── Releases ──────────────────────────────────────────────────────────
  // Only installers: GitHub's "Source code" archives are not assets and are
  // never listed; SHA256SUMS.txt and anything else is skipped too.
  const KINDS = [
    { repo: 'desktop', match: /\.dmg$/i, key: 'dmg', device: 'mac' },
    { repo: 'desktop', match: /\.exe$/i, key: 'exe', device: 'win' },
    { repo: 'android', match: /tv\.apk$/i, key: 'tv', device: 'tv' },
    { repo: 'android', match: /tablet\.apk$/i, key: 'tablet', device: 'tablet' },
    { repo: 'android', match: /phone\.apk$/i, key: 'phone', device: 'phone' },
  ];
  // Without the API (offline, rate-limited): links that always work.
  const FALLBACK = {
    dmg: `https://github.com/${REPOS.desktop}/releases/latest`,
    exe: `https://github.com/${REPOS.desktop}/releases/latest`,
    tv: `https://github.com/${REPOS.android}/releases/latest/download/kam-iptv-tv.apk`,
    tablet: `https://github.com/${REPOS.android}/releases/latest/download/kam-iptv-tablet.apk`,
    phone: `https://github.com/${REPOS.android}/releases/latest/download/kam-iptv-phone.apk`,
  };
  const releases = { desktop: undefined, android: undefined };

  const fetchLatest = async (repo) => {
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } });
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  };

  const mb = (bytes) => `${Math.round(bytes / 1048576)} MB`;
  const day = (iso) => new Intl.DateTimeFormat(lang, { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(iso));
  const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';

  const filesFor = (repoKey) => {
    const rel = releases[repoKey];
    return KINDS.filter((k) => k.repo === repoKey).map((k) => {
      const asset = rel && rel.assets ? rel.assets.find((a) => k.match.test(a.name)) : null;
      return { ...k, url: asset ? asset.browser_download_url : FALLBACK[k.key], size: asset ? asset.size : null };
    });
  };

  const renderCard = (repoKey) => {
    const list = document.getElementById(`files-${repoKey}`);
    const foot = document.getElementById(`foot-${repoKey}`);
    const rel = releases[repoKey];
    if (rel === undefined) return; // still loading
    list.innerHTML = filesFor(repoKey).map((f) => {
      const rec = f.device === platform;
      const meta = [t(`f.${f.key}Meta`), f.size ? mb(f.size) : null].filter(Boolean).join(' · ');
      return `<li><a class="file${rec ? ' recommended' : ''}" href="${esc(f.url)}">
        <span><span class="name">${esc(t(`f.${f.key}`))}</span>${rec ? ` <span class="tag">${esc(t('f.recommended'))}</span>` : ''}<br><span class="meta">${esc(meta)}</span></span>
        <span class="dl">${DL_ICON}</span></a></li>`;
    }).join('');
    const repo = REPOS[repoKey];
    foot.innerHTML = rel
      ? [
          `<span>${esc(t('foot.version', { v: rel.tag_name.replace(/^v/, '') }))}</span>`,
          rel.published_at ? `<span>${esc(t('foot.date', { d: day(rel.published_at) }))}</span>` : '',
          `<a href="${esc(rel.html_url)}">${esc(t('foot.notes'))}</a>`,
          `<a href="https://github.com/${repo}/releases">${esc(t('foot.all'))}</a>`,

  };

    const cta = document.getElementById('hero-cta');
    const hint = document.getElementById('hero-hint');
    const all = [...filesFor('desktop'), ...filesFor('android')];
    const mine = all.find((f) => f.device === platform);
    const name = { mac: 'macOS', win: 'Windows', tv: 'Android TV', tablet: t('f.tablet'), phone: 'Android' }[platform];
    if (mine && (releases[mine.repo] !== undefined)) {
      cta.innerHTML = `<a class="btn primary" href="${esc(mine.url)}">${DL_ICON}<span>${esc(t('hero.for', { p: name }))}</span>${mine.size ? ` <small>${esc(mb(mine.size))}</small>` : ''}</a>
        <a class="btn" href="#download">${esc(t('hero.other'))}</a>`;
      hint.textContent = t(platform === 'mac' ? 'hint.mac' : platform === 'win' ? 'hint.win' : 'hint.android');
    } else {
      cta.innerHTML = `<a class="btn primary" href="#download">${DL_ICON}<span>${esc(t('hero.download'))}</span></a>`;
      hint.textContent = '';
    }
  };

  // ── Tabs ──────────────────────────────────────────────────────────────
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const select = (name) => tabs.forEach((b) => {
    const on = b.dataset.tab === name;
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
    document.getElementById(b.getAttribute('aria-controls')).hidden = !on;
  });
  tabs.forEach((b, i) => {
    b.addEventListener('click', () => select(b.dataset.tab));
    b.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      next.focus(); select(next.dataset.tab);
    });
  });
  select({ mac: 'mac', win: 'win', tv: 'tv', tablet: 'phone', phone: 'phone' }[platform] || 'mac');

  const apply = () => {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.innerHTML = emph(t(el.dataset.i18n)); });
    // Trusted strings from the table above (they carry <b>/<code>).
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    renderCard('desktop');
    renderCard('android');
    renderHero();
  };
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('kam-site-lang', lang); apply();
  }));
  apply();

  Promise.all([fetchLatest(REPOS.desktop), fetchLatest(REPOS.android)]).then(([d, a]) => {
    releases.desktop = d;
    releases.android = a;
    apply();
  });
})();
</script>
</body>
</html>
